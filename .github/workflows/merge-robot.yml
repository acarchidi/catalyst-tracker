name: Merge robot

# Merges a pull request from a claude/ branch into main once CI and the Claude review
# have both succeeded on its latest commit (ADR 0007). workflow_run always runs this
# file and scripts/merge_gate.py as they are on main, so a pull request cannot change
# the rules for its own merge. Pull requests that change the robot or the review are
# left for the owner. Add the "hold" label to a pull request to stop the robot merging it.

on:
  workflow_run:
    workflows: [CI, Claude review]
    types: [completed]

permissions: {}

concurrency:
  group: merge-robot-${{ github.event.workflow_run.head_sha }}
  cancel-in-progress: false

jobs:
  merge:
    name: Merge when every check passes
    if: ${{ github.event.workflow_run.event == 'pull_request' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
      pull-requests: write
      checks: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Decide, then merge or tell the owner
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          set -euo pipefail
          pr=$(gh api "repos/$REPO/commits/$SHA/pulls" --jq '[.[] | select(.state == "open")][0].number // empty')
          if [ -z "$pr" ]; then
            echo "No open pull request has commit $SHA." | tee -a "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          gh pr view "$pr" --repo "$REPO" \
            --json state,isDraft,baseRefName,headRefName,headRefOid,isCrossRepository,labels > "$RUNNER_TEMP/pr.json"
          gh api "repos/$REPO/pulls/$pr/files?per_page=100" --paginate \
            --jq '.[] | .filename, (.previous_filename // empty)' | jq -R . | jq -s . > "$RUNNER_TEMP/files.json"
          gh api "repos/$REPO/commits/$SHA/check-runs?per_page=100" --paginate \
            --jq '.check_runs[] | {name, status, conclusion, id, app: .app.slug}' | jq -s . > "$RUNNER_TEMP/checks.json"
          decision=$(python3 -I scripts/merge_gate.py "$SHA" "$RUNNER_TEMP/pr.json" "$RUNNER_TEMP/files.json" "$RUNNER_TEMP/checks.json")
          action=$(jq -r .action <<<"$decision")
          reason=$(jq -r .reason <<<"$decision")
          echo "Pull request #$pr at $SHA: $action ($reason)" | tee -a "$GITHUB_STEP_SUMMARY"
          case "$action" in
            merge)
              gh pr merge "$pr" --repo "$REPO" --merge --match-head-commit "$SHA"
              ;;
            owner)
              marker="<!-- merge-robot:$SHA -->"
              seen=$(gh api "repos/$REPO/issues/$pr/comments" --paginate \
                --jq "[.[] | select(.user.login == \"github-actions[bot]\" and (.body | contains(\"$marker\")))] | length" \
                | jq -s add)
              if [ "${seen:-0}" -eq 0 ]; then
                printf '%s\n\n**Waiting for the owner.** Every check passed, but the robot does not merge this pull request because %s. The owner merges it by hand.\n' \
                  "$marker" "$reason" > "$RUNNER_TEMP/owner.md"
                gh pr comment "$pr" --repo "$REPO" --body-file "$RUNNER_TEMP/owner.md"
              fi
              ;;
          esac

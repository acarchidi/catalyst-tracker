name: Gate 1 live run

# Throwaway diagnostic on a side branch, never merged: finds which Session pooler host
# serves this project. Connects, runs SELECT 1, disconnects; changes no data.

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  gate1:
    name: Pooler diagnostic
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
      - run: uv sync --locked
      - env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
        run: |
          uv run python - <<'PY'
          import os, re
          from urllib.parse import urlsplit
          import psycopg
          parts = urlsplit(os.environ["SUPABASE_DB_URL"].strip().replace("[YOUR-PASSWORD]", "x"))
          print("scheme:", parts.scheme, "| user:", parts.username, "| host:", parts.hostname, "| port:", parts.port, "| path:", parts.path)
          m = re.fullmatch(r"db\.([a-z0-9]+)\.supabase\.co", parts.hostname or "")
          ref = m.group(1) if m else (parts.username or "").removeprefix("postgres.")
          for n in (0, 1, 2):
              host = f"aws-{n}-us-west-2.pooler.supabase.com"
              try:
                  with psycopg.connect(host=host, port=5432, dbname="postgres", user=f"postgres.{ref}",
                                       password=os.environ["SUPABASE_DB_PASSWORD"], sslmode="require",
                                       connect_timeout=15) as conn:
                      print(host, "-> connected;", conn.execute("select current_user").fetchone())
              except Exception as e:
                  print(host, "->", type(e).__name__, str(e).splitlines()[0][:200])
          PY

name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: Lint, types, tests, migrations
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: catalyst
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      CATALYST_DATABASE_URL: postgresql+psycopg://postgres:postgres@localhost:5432/catalyst
      CATALYST_TEST_DATABASE_URL: postgresql+psycopg://postgres:postgres@localhost:5432/catalyst_test
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
      - name: Install locked dependencies
        run: uv sync --locked
      - name: Lint
        run: uv run ruff check --output-format github .
      - name: Formatting
        run: uv run ruff format --check .
      - name: Strict types
        run: uv run pyright
      - name: Migrations upgrade, downgrade, upgrade, and match the models
        run: |
          uv run alembic upgrade head
          uv run alembic downgrade base
          uv run alembic upgrade head
          uv run alembic check
      - name: Tests with coverage
        run: |
          PGPASSWORD=postgres psql -h localhost -U postgres -c "CREATE DATABASE catalyst_test"
          uv run pytest

  audit:
    name: Dependency audit
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
      - name: Audit locked dependencies for known vulnerabilities
        run: |
          uv export --locked --all-groups --no-hashes --no-emit-project --format requirements-txt > requirements-audit.txt
          uvx pip-audit --strict --disable-pip --no-deps -r requirements-audit.txt

  secrets:
    name: Secret scan
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      pull-requests: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_ENABLE_COMMENTS: false

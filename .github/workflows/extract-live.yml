name: Extract catalysts (live)

# Runs the catalyst extractor (ADR 0013), in one of two modes:
# - extract: on the newest press releases in the live database. Safe to re-run: documents
#   already extracted with the same prompt version are skipped. Results are claims, never
#   published catalysts.
# - evaluate: on the 12 recorded releases of the gold set, to earn a prompt's scores
#   (ADR 0014): the extractor's, or the verifier's second reading (ADR 0018, part 2). The
#   scores go to the job summary for the coding session to commit.
# - export: writes every published catalyst, and the claims the publish gate held with their
#   reasons, to one JSON file for the owner's private prototype page (owner request
#   2026-10-18). No model call. The file goes to the run log only while the repository is
#   private.
# Extract and export first bring the live database up to date, so the checks' tables exist.
# Started by hand from the Actions tab or by the coding session; costs a few cents per
# release, inside the daily cap of the role that runs (extractor or verifier; config/models.toml).
# After an extraction, plain code turns the run's summary and today's spend into alert issues
# for the owner (ADR 0023); a separate job, the only one that may write issues, posts them.

on:
  workflow_dispatch:
    inputs:
      mode:
        description: "extract (newest press releases) or evaluate (score on the gold set)"
        type: choice
        options: [extract, evaluate, export]
        default: extract
      limit:
        description: "Most press releases to read in this run"
        type: number
        required: true
        default: 50
      prompt:
        description: "evaluate only: which reader to score"
        type: choice
        options: [extract_catalysts, verify_catalysts]
        default: extract_catalysts

permissions:
  contents: read

concurrency:
  group: live-database
  cancel-in-progress: false

jobs:
  extract:
    name: Extract catalysts
    runs-on: ubuntu-latest
    # GitHub cancels a job that reaches its limit, and a cancelled job skips its alert step, so
    # the long step has its own, lower limit: a step that times out fails, and the alert says so.
    timeout-minutes: 60
    outputs:
      alerts: ${{ steps.alerts.outputs.plan }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
      - name: Install locked dependencies
        run: uv sync --locked

      - name: Bring the live database up to date
        id: migrate
        if: ${{ inputs.mode == 'extract' || inputs.mode == 'export' }}
        timeout-minutes: 10
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
        run: uv run alembic upgrade head

      - name: Extract catalysts from the newest press releases
        id: extract
        if: ${{ inputs.mode == 'extract' }}
        timeout-minutes: 45
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
          CATALYST_ANTHROPIC_API_KEY: ${{ secrets.CATALYST_ANTHROPIC_API_KEY }}
          LIMIT: ${{ inputs.limit }}
          REPOSITORY_PRIVATE: ${{ github.event.repository.private }}
        run: |
          set +e
          uv run catalyst extract-catalysts --limit "$LIMIT" --snapshot-store supabase \
            --out "$RUNNER_TEMP/catalysts.json" > "$RUNNER_TEMP/summary.json"
          status=$?
          { echo "## Catalysts found"; echo '```json'; cat "$RUNNER_TEMP/summary.json"; echo '```'; } \
            | tee -a "$GITHUB_STEP_SUMMARY"
          # The full results (unchecked proposals with their quotes) go to the run log only while
          # the repository is private: a public log would publish them (AGENTS.md).
          if [ "$REPOSITORY_PRIVATE" = "true" ]; then
            echo "::group::Full results (JSON)"
            cat "$RUNNER_TEMP/catalysts.json" 2>/dev/null
            echo  # the JSON has no final newline; without this, the marker below joins its last line
            echo "::endgroup::"
          fi
          exit "$status"

      # Free: no model call.
      - name: Export published and held catalysts
        if: ${{ inputs.mode == 'export' }}
        timeout-minutes: 10
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
          REPOSITORY_PRIVATE: ${{ github.event.repository.private }}
        run: |
          set -o pipefail
          uv run catalyst export-catalysts --out "$RUNNER_TEMP/export.json" --include-held \
            | tee -a "$GITHUB_STEP_SUMMARY"
          # Held claims are unchecked: the file goes to the run log only while the repository is
          # private, never to a public log (AGENTS.md).
          if [ "$REPOSITORY_PRIVATE" = "true" ]; then
            echo "::group::Export (JSON)"
            cat "$RUNNER_TEMP/export.json"
            echo
            echo "::endgroup::"
          fi

      # Free: no model call. Runs even when the extraction failed, so the failure is reported.
      - name: Build alerts from this run
        id: alerts
        if: ${{ !cancelled() && inputs.mode == 'extract' }}
        timeout-minutes: 5
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
          OUTCOME: ${{ steps.extract.outcome }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -o pipefail
          { echo "## Alerts"; uv run catalyst alerts --run "extract-catalysts:$OUTCOME:$RUNNER_TEMP/summary.json" \
            --spend --run-url "$RUN_URL" --out "$RUNNER_TEMP/alerts.json"; } | tee -a "$GITHUB_STEP_SUMMARY"
          delimiter="plan_$(openssl rand -hex 16)"
          { echo "plan<<$delimiter"; cat "$RUNNER_TEMP/alerts.json"; echo "$delimiter"; } >> "$GITHUB_OUTPUT"

      - name: Score a reader on the gold set
        if: ${{ inputs.mode == 'evaluate' }}
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
          CATALYST_ANTHROPIC_API_KEY: ${{ secrets.CATALYST_ANTHROPIC_API_KEY }}
          PROMPT: ${{ inputs.prompt }}
        run: |
          set +e
          uv run catalyst eval-extractor --prompt "$PROMPT" --out "$RUNNER_TEMP/scores.json" > /dev/null
          status=$?
          { echo "## Scores: $PROMPT"; echo '```json'; cat "$RUNNER_TEMP/scores.json" 2>/dev/null; echo '```'; } \
            | tee -a "$GITHUB_STEP_SUMMARY"
          exit "$status"

  post-alerts:
    name: Post alerts
    needs: extract
    if: ${{ !cancelled() && needs.extract.outputs.alerts != '' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      issues: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
      - name: Install locked dependencies
        run: uv sync --locked
      - name: Open, update, or close alert issues
        env:
          GITHUB_TOKEN: ${{ github.token }}
          PLAN: ${{ needs.extract.outputs.alerts }}
        run: |
          printf '%s\n' "$PLAN" > "$RUNNER_TEMP/alerts.json"
          uv run catalyst post-issues --from "$RUNNER_TEMP/alerts.json"

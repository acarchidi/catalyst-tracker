name: Review key check

# Since 2026-10-20 the Claude review and the Overseer end in under a second with no result,
# and their logs never show the API's answer (ADR 0045). This job, run by hand, sends one
# tiny request with the review key to each model and prints only the HTTP status and the
# API's error type and message. The key is passed in a header from the secret and is never
# printed; GitHub also masks it. Each request asks for at most one token.

on:
  workflow_dispatch:

permissions: {}

jobs:
  check:
    name: Review key check
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Ask the API once per model
        env:
          KEY: ${{ secrets.CATALYST_REVIEW_API_KEY }}
        run: |
          set -u
          if [ -z "$KEY" ]; then echo "CATALYST_REVIEW_API_KEY is empty or missing."; exit 1; fi
          for model in claude-opus-5-5 claude-haiku-5-5; do
            rm -f /tmp/answer.json
            body=$(jq -nc --arg m "$model" '{model:$m,max_tokens:1,messages:[{role:"user",content:"ok"}]}')
            status=$(curl -sS -o /tmp/answer.json -w '%{http_code}' https://api.anthropic.com/v1/messages \
              -H "x-api-key: $KEY" -H "anthropic-version: 2023-06-01" -H "content-type: application/json" \
              -d "$body") || status="no answer"
            echo "$model: HTTP $status"
            jq -r 'if .error then "  error: \(.error.type): \(.error.message)" else "  worked" end' /tmp/answer.json 2>/dev/null || echo "  the answer was not JSON"
          done

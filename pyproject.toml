[project]
name = "catalyst"
version = "0.1.0"
description = "Biotech catalyst tracker: collectors, agents, verification, and API."
readme = "pipeline/README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "alembic>=1.20.0",
    "anthropic>=1.15.0",
    "httpx>=0.28.1",
    "httpx2>=2.13.1",
    "jsonschema>=4.26.0",
    "psycopg[binary]>=3.3.6",
    "pydantic>=2.14.1",
    "sqlalchemy>=2.1.4",
]

[project.scripts]
catalyst = "catalyst.cli:main"

[build-system]
requires = ["uv_build>=0.11,<0.12"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "catalyst"
module-root = "pipeline"

[dependency-groups]
dev = [
    "hypothesis>=6.170.0",
    "pip-audit>=2.10.1",
    "pre-commit>=4.7.0",
    "pyright>=1.1.414",
    "pytest>=9.1.1",
    "pytest-cov>=7.1.0",
    "ruff>=0.17.1",
    "types-jsonschema>=4.26.0.20261006",
]

[tool.ruff]
line-length = 110
target-version = "py312"
src = ["pipeline", "tests"]

[tool.ruff.lint]
select = ["E", "W", "F", "I", "B", "UP", "C90", "D", "S", "SIM", "RUF", "DTZ", "PT"]
ignore = ["D203", "D213"]

[tool.ruff.lint.mccabe]
max-complexity = 10

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "D100", "D101", "D102", "D103", "D107"]
# Generated migrations carry long column comments copied from the models.
"pipeline/migrations/versions/**" = ["E501"]

[tool.pyright]
typeCheckingMode = "strict"
pythonVersion = "3.12"
include = ["pipeline", "tests", "scripts"]
venvPath = "."
venv = ".venv"
extraPaths = ["pipeline", "tests"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--strict-markers --cov=catalyst --cov-report=term-missing --cov-fail-under=80"

[tool.coverage.run]
branch = true
source = ["catalyst"]
omit = ["pipeline/migrations/*"]

# Model assignments per agent role (spec: Implementation handoff, Model assignments).
# Changing a role's model or provider is a one-line, reviewed change. A role that reaches its
# daily cap stops and alerts; it never switches to another model (AGENTS.md).
#
# Prices: US dollars per million tokens, from https://platform.claude.com/docs/en/about-claude/pricing
# (read 2026-10-16). cache_write is the 5-minute cache write price.

version = "2026-10-16.1"

[pricing.claude-haiku-5-5]
input = "0.10"
cache_write = "0.125"
cache_read = "0.01"
output = "0.50"
long_context_threshold = 100000

[pricing.claude-haiku-5-5.long_context]
input = "0.50"
cache_write = "0.625"
cache_read = "0.05"
output = "2.50"

[pricing.claude-sonnet-5-5]
input = "2"
cache_write = "2.50"
cache_read = "0.10"
output = "10"

[pricing.claude-opus-5-5]
input = "4"
cache_write = "5"
cache_read = "0.20"
output = "20"

# Daily caps add up to $13.50, about $405 a month at most: inside the spec's $150 to $600
# model-cost estimate. Owner's Anthropic workspace limit is $50 a month (docs/setup.md Part 2),
# which is lower and wins until the owner raises it.

[roles.triage]
provider = "anthropic"
model = "claude-haiku-5-5"
max_tokens = 1024
effort = "low"
daily_cap_usd = "0.50"

[roles.extractor]
provider = "anthropic"
model = "claude-sonnet-5-5"
max_tokens = 16000
effort = "medium"
daily_cap_usd = "4.00"

[roles.verifier]
provider = "anthropic"
model = "claude-sonnet-5-5"
max_tokens = 16000
effort = "medium"
daily_cap_usd = "4.00"

[roles.entity_resolver]
provider = "anthropic"
model = "claude-sonnet-5-5"
max_tokens = 4000
effort = "low"
daily_cap_usd = "0.50"

[roles.outcome]
provider = "anthropic"
model = "claude-sonnet-5-5"
max_tokens = 16000
effort = "medium"
daily_cap_usd = "1.00"

[roles.auditor]
provider = "anthropic"
model = "claude-sonnet-5-5"
max_tokens = 16000
effort = "medium"
daily_cap_usd = "1.00"

[roles.analyst]
provider = "anthropic"
model = "claude-opus-5-5"
max_tokens = 16000
effort = "high"
daily_cap_usd = "1.50"

[roles.assistant]
provider = "anthropic"
model = "claude-sonnet-5-5"
max_tokens = 4000
effort = "low"
daily_cap_usd = "0.50"

[roles.orchestrator]
provider = "anthropic"

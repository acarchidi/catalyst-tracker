# Model assignments per agent role (spec: Implementation handoff, Model assignments).
# Changing a role's model or provider is a one-line, reviewed change. A role that reaches its
# daily cap stops and alerts; it never switches to another model (AGENTS.md).
#
# Prices: US dollars per million tokens, from https://platform.claude.com/docs/en/about-claude/pricing
# (read 2026-10-16). cache_write is the 5-minute cache write price.

version = "2026-11-25.1"

[pricing.claude-haiku-5-5]
input = "0.10"
cache_write = "0.125"
cache_read = "0.01"
output = "0.50"
long_context_threshold = 100000

[pricing.claude-haiku-5-5.long_context]
input = "0.50"
cache_write = "0.625"
cache_read = "0.05"
output = "2.50"

[pricing.claude-sonnet-5-5]
input = "2"
cache_write = "2.50"
cache_read = "0.10"
output = "10"

[pricing.claude-opus-5-5]
input = "4"
cache_write = "5"
cache_read = "0.20"
output = "20"

# Daily caps add up to $6.00, about $180 a month at most (owner decision 2026-10-17, lowered
# from $13.50 to fit the budget while building; ADR 0022). For the first full run on
# 2026-10-18 the owner raised the extractor to $11.00 and the verifier to $4.50 (total
# $17.50) for one day; both are back at $2.00. Each cap must cover one worst-case
# call of its role: the analyst's is $0.50 because one Opus call can cost about $0.35. Owner's Anthropic workspace limit is $50 a
# month (docs/setup.md Part 2), which is lower and wins until the owner raises it.
#
# A `raised_caps` entry replaces a role's daily cap on the New York days from `first_day` to
# `last_day` only; from the next day the usual cap applies again with no change to this file.
# 2026-11-24 to 2026-12-08: the owner's written OK (2026-11-23) to read 2025 and 2026 press releases
# with the promotional API credit (about $96, expiring 2026-12-08): the extractor at $8.00 and the
# verifier at $4.00, the verifier being about half the extractor's work (ADR 0065). Back to $2.00
# each from 2026-12-09.
# A `filings_share` lets the reads of 10-Qs, 10-Ks and other 8-K exhibits use at most that part of
# a raised cap, counted on the role's whole spend that day, and only while the promotional credit
# still pays for the day; 0.5 is the most the code accepts. The owner's written OK (2026-11-25)
# to read the newest filings on the same credit: half of the $8.00 and of the $4.00, so the
# press-release backfill keeps the rest; the caps themselves do not change (ADR 0081). From
# 2026-12-09 filings are back at the usual $2.00 with the caps.

[roles.triage]
provider = "anthropic"
model = "claude-haiku-5-5"
max_tokens = 1024
effort = "low"
daily_cap_usd = "0.25"

[roles.extractor]
provider = "anthropic"
model = "claude-sonnet-5-5"
max_tokens = 16000
effort = "medium"
daily_cap_usd = "2.00"

[[roles.extractor.raised_caps]]
cap_usd = "8.00"
first_day = 2026-11-24
last_day = 2026-12-08
approved = "owner, in writing, 2026-11-23: press-release backfill on the promotional credit (ADR 0065)"
filings_share = "0.50"
filings_approved = "owner, in writing, 2026-11-25: newest 10-Qs, 10-Ks and other 8-K exhibits on the promotional credit, at most half of this cap (ADR 0081)"

[roles.verifier]
provider = "anthropic"
model = "claude-sonnet-5-5"
max_tokens = 16000
effort = "medium"
daily_cap_usd = "2.00"

[[roles.verifier.raised_caps]]
cap_usd = "4.00"
first_day = 2026-11-24
last_day = 2026-12-08
approved = "owner, in writing, 2026-11-23: press-release backfill on the promotional credit (ADR 0065)"
filings_share = "0.50"
filings_approved = "owner, in writing, 2026-11-25: newest 10-Qs, 10-Ks and other 8-K exhibits on the promotional credit, at most half of this cap (ADR 0081)"

[roles.entity_resolver]
provider = "anthropic"
model = "claude-sonnet-5-5"
max_tokens = 4000
effort = "low"
daily_cap_usd = "0.25"

[roles.outcome]
provider = "anthropic"
model = "claude-sonnet-5-5"
max_tokens = 16000
effort = "medium"
daily_cap_usd = "0.25"

[roles.auditor]
provider = "anthropic"
model = "claude-sonnet-5-5"
max_tokens = 16000
effort = "medium"
daily_cap_usd = "0.50"

[roles.analyst]
provider = "anthropic"
model = "claude-opus-5-5"
max_tokens = 16000
effort = "high"
daily_cap_usd = "0.50"

[roles.assistant]
provider = "anthropic"
model = "claude-sonnet-5-5"
max_tokens = 4000
effort = "low"
daily_cap_usd = "0.125"

[roles.orchestrator]
provider = "anthropic"
model = "claude-sonnet-5-5"
max_tokens = 4000
effort = "low"
daily_cap_usd = "0.125"

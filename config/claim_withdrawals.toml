# Claims withdrawn after a person's review (ADR 0070). Reviewed like code; data is never edited by hand.
# The publish gate holds each listed claim, and the writer unpublishes any live catalyst it stands behind,
# with a status change in that catalyst's history. An entry only ever withholds.
# claim: a full claim id, or a prefix of at least 8 hex characters naming exactly one claim; a prefix that
#   names none or several stops the gate's run, and the run's alert says so.
# reason: plain English, shown as "withdrawn after review: <reason>".
# evidence: a web address, or "own source" when the claim's own source document shows the error.

